<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Market Place</h1>
      <nav>
        <a href="#produk">Produk</a>
        <a href="#kontak">Kontak</a>
        <a href="#" class="cart-link"
          >Keranjang (<span id="cart-cont">0</span>)</a
        >
      </nav>
    </header>
    <main id="produk">
      <div class="product-grid">
        <div class="product-card">
          <img src= "929782285576802822.jpg" alt="tas barbie" />
          <h3>tas barbie</h3>
          <p class="price">Rp-1.500.000,00</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-min">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="tas barbiee"
            data-harga="1500000"
          >
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="mini.jpg" alt="mini handled fun" />
          <h3>mini handled fun</h3>
          <p class="price">Rp-550.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="mini handled fun" data-harga="550000">
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="A pink crocs 💖🌷🎀.jpg" alt="crocs" />
          <h3>crocs</h3>
          <p class="price">Rp2.600.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="crocs"
            data-harga="2600000"
          >
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="Barbie perfume 🌼✨.jpg" alt="parfume barbiee" />
          <h3>parfum barbiee</h3>
          <p class="price">Rp-2.500.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button class="buy-btn" data-nama="parfum barbiee" data-harga="2500000">
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="braclet.jpg" alt="braclet" />
          <h3>braclet</h3>
          <p class="price">Rp-1.550.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="braclet"
            data-harga="1550000"
          >
            Beli Sekarang
          </button>
        </div>
        <div class="product-card">
          <img src="puma.jpg" alt="sepatu puma" />
          <h3>sepatu puma</h3>
          <p class="price">Rp-14.550.000</p>
          <div class="quantity-stepper">
            <button type="button" class="qty-btn btn-minus">-</button>
            <input type="text" class="qty-value" value="1" readonly />
            <button type="button" class="qty-btn btn-plus">+</button>
          </div>
          <button
            class="buy-btn"
            data-nama="sepatu puma"
            data-harga="14550000"
          >
            Beli Sekarang
          </button>
        </div>
      </div>
    </main>
    <footer id="kontak">
      <h3>Hubungi Kami</h3>
      <form class="contact-form">
        <label for="nama">Nama:</label>
        <input type="text" id="nama" placeholder="Nama lengkap" />

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Email aktif" />

        <label for="pesan">Pesan:</label>
        <textarea id="pesan" placeholder="Tulis pesan..."></textarea>

        <button type="submit">Kirim Pesan</button>
      </form>
      <p>copyright 2026 by llnmm</p>
    </footer>
    <script src="./script.js"></script>
  </body>
</html>
